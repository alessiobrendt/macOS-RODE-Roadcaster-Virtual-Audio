# channel-map.example.conf
#
# Example / template for config/channel-map.conf, which rodevad-router
# reads once at startup (see LoadChannelMapFromConfig in
# daemon/rodevad-router.c) to override the compiled-in default channel
# mapping. This file itself is documentation + a template -- it is NOT
# read by the daemon directly (the real, live config lives at
# config/channel-map.conf, which is gitignored since it's local runtime
# state, not something to track/ship).
#
# The RodeVADTester GUI's ChannelMapStore also falls back to reading THIS
# file (as a starting point to edit) if config/channel-map.conf doesn't
# exist yet -- see gui/.../ChannelMapStore.swift.
#
# Format: one "device=<1-based starting Multitrack channel>" line per
# device. Blank lines and lines starting with # are ignored.
#
# Each device occupies TWO consecutive channels on the RodeCaster Pro II's
# "Main Multitrack" 10-channel USB device: the channel you specify here,
# and the very next one. For example, "system=1" means "RVAD System" is
# copied into Multitrack channels 1 and 2.
#
# Rules (rodevad-router validates and refuses to start on any violation --
# see README "Routing daemon" and "Known limitations"):
#   - All 5 keys below (system, game, music, virtuala, virtualb) must be
#     present, each exactly once.
#   - Each value must be a plain integer from 1 to 9 (a device starting at
#     9 occupies channels 9-10, the last valid pair on a 10-channel
#     device; starting at 10 would need an 11th channel, which doesn't
#     exist).
#   - No two devices' channel pairs may overlap.
#
# These are the compiled-in defaults -- our own best guess at RODE's
# layout, not confirmed against their real driver (see README "Known
# limitations"). Edit the values below (via the GUI's Channel Mapping tab,
# or by hand) and copy this file to config/channel-map.conf, then restart
# rodevad-router, to try a different layout.

system=1
game=3
music=5
virtuala=7
virtualb=9
